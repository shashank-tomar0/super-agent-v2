<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VLESS Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ─── Top Bar ─────────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-mark">V</span>
        <span class="brand-name">VLESS</span>
        <span class="egress-badge" id="egress-badge">0 KB EGRESS</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-perception" title="Privacy audit">◉</button>
        <button class="icon-btn" id="btn-settings" title="Settings">⚙</button>
      </div>
    </header>

    <!-- ─── Masthead ────────────────────────────────────────────────── -->
    <div class="masthead">
      <span>FREE BROADSHEET<span class="dot-sep">·</span>EDITION 04</span>
      <span id="perception-counter">PERCEPTION N° 01</span>
    </div>

    <h1 class="headline">
      <span class="headline-private">PRIVATE</span> VISUAL AGENT
    </h1>
    <p class="subhead">Zero data egress. PII detection &amp; privacy pipeline run 100% inside your browser.</p>

    <hr class="rule" />

    <!-- ─── Context Presets ─────────────────────────────────────────── -->
    <div class="section-header">
      <span>CONTEXT PRESETS</span>
      <div class="preset-btns">
        <button class="preset-btn" data-preset="aadhaar"><span>+ AADHAAR</span></button>
        <button class="preset-btn" data-preset="pan"><span>+ PAN</span></button>
        <button class="preset-btn" data-preset="contact"><span>+ CONTACT</span></button>
      </div>
    </div>

    <!-- ─── Task Input ──────────────────────────────────────────────── -->
    <div class="input-box">
      <textarea
        id="task-input"
        rows="2"
        placeholder="Instruct agent (e.g. fill form, scan PII)..."
      ></textarea>
      <button id="run-btn" class="run-arrow" title="Run task">→</button>
      <button id="stop-btn" class="run-arrow stop hidden" title="Stop task">■</button>
    </div>

    <!-- ─── Quick Actions ───────────────────────────────────────────── -->
    <div class="section-header">
      <span>QUICK ACTIONS</span>
    </div>
    <div class="quick-grid">
      <button class="quick-btn" data-action="fill-form"><span>✎ FILL FORM</span></button>
      <button class="quick-btn" data-action="extract-data"><span>📊 EXTRACT DATA</span></button>
      <button class="quick-btn" data-action="scan-pii"><span>◎ SCAN PII</span></button>
      <button class="quick-btn" data-action="click-target"><span>⊘ CLICK TARGET</span></button>
    </div>

    <hr class="rule-thin" />

    <!-- ─── Transcript ──────────────────────────────────────────────── -->
    <div class="transcript-area" id="transcript">
      <div class="empty-state" id="empty">
        <div class="empty-icon">◉</div>
        <p>AGENT STANDING BY</p>
        <p class="empty-sub">Give a task or use a quick action above.</p>
      </div>
    </div>

    <!-- ─── Status Bar ──────────────────────────────────────────────── -->
    <div class="status-bar">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">IDLE</span>
      <div class="status-bar-right">
        <button id="new-task-btn" class="link-btn">NEW</button>
      </div>
    </div>

    <!-- ─── Confirm Dialog ──────────────────────────────────────────── -->
    <div id="confirm" class="confirm-bar hidden">
      <span id="confirm-text"></span>
      <div class="confirm-actions">
        <button id="confirm-no" class="confirm-btn">DECLINE</button>
        <button id="confirm-yes" class="confirm-btn confirm-allow">ALLOW</button>
      </div>
    </div>

    <!-- ─── Privacy Audit Panel ─────────────────────────────────────── -->
    <div id="privacy-audit" class="privacy-audit hidden">
      <div class="audit-header">
        <span class="audit-title">🔒 PRIVACY AUDIT</span>
        <button id="audit-close" class="link-btn">CLOSE ×</button>
      </div>
      <div id="audit-summary" class="audit-summary"></div>
      <div id="audit-screenshots" class="audit-screenshots"></div>
      <div id="audit-detections" class="audit-detections"></div>
      <div id="audit-tokens" class="audit-tokens"></div>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
